{% extends "blog/base_blog.html" %}

{% block title %}{{ post.title }} — Paws &amp; Love{% endblock %}

{% block extra_head %}
<style>
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.85rem;
    margin-bottom: 2.5rem;
    transition: color 0.2s;
  }

  .back-link:hover { color: var(--pink); }

  .post-meta {
    font-size: 0.78rem;
    color: var(--pink);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0.8rem;
  }

  h1.post-heading {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: var(--text);
    line-height: 1.15;
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .post-body {
    font-size: 1.05rem;
    line-height: 1.9;
    color: var(--text-muted);
    white-space: pre-wrap;
  }
</style>
{% endblock %}

{% block content %}
<a class="back-link" href="{% url 'blog:list' %}">← All Posts</a>
<p class="post-meta">{{ post.created_at|date:"F j, Y" }}</p>
<h1 class="post-heading">{{ post.title }}</h1>
<div class="post-body">{{ post.content }}</div>
{% endblock %}
